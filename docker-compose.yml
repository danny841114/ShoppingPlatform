version: '3.8'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: mssql

    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Aa12345!"

    ports:
      - "1433:1433"

    command: bash -c "/opt/mssql/bin/sqlservr & echo '等待 SQL Server 開機...'; until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Aa12345!' -C -Q 'SELECT 1' &> /dev/null; do echo '熱機中...'; sleep 2; done; echo 'SQL Server 已就緒，開始建立資料庫...'; /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Aa12345!' -C -Q 'IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = \"shopping_platform\") CREATE DATABASE shopping_platform;'; wait"

  spring-app:
    image: spring-demo

    container_name: shopping-platform-app

    depends_on:
      - sqlserver

    ports:
      - "8080:8080"

    restart: on-failure